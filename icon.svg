<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="url(#fire)" stroke-width="14"/>
  <!-- Triangle de Pythagore néon -->
  <polygon points="120,380 390,380 120,130" fill="rgba(56,189,248,0.22)" stroke="#38bdf8" stroke-width="18" stroke-linejoin="round"/>
  <rect x="120" y="330" width="50" height="50" fill="none" stroke="#facc15" stroke-width="12"/>
  <!-- Éclair / Épée -->
  <polygon points="318,92 246,232 308,232 256,348 394,196 328,196" fill="url(#fire)"/>
  <!-- Badge T -->
  <text x="256" y="458" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="900" letter-spacing="4">TITOU 4e</text>
</svg>
